name: Poll Telegram for Links

on:
  schedule:
    # Run automatically every day at 9:45 AM PT (16:45 UTC)
    - cron: "45 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll-telegram:
    name: Poll Telegram Updates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies (Pandoc & Typst)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          curl -sL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run poll script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YTDLP_COOKIES_TXT: ${{ secrets.YTDLP_COOKIES_TXT }}
          KINDLE_ENABLED: "true"
          KINDLE_DELIVERY_METHOD: "smtp"
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          KINDLE_SENDER_EMAIL: ${{ secrets.KINDLE_SENDER_EMAIL }}
          KINDLE_SMTP_HOST: ${{ secrets.KINDLE_SMTP_HOST }}
          KINDLE_SMTP_PORT: ${{ secrets.KINDLE_SMTP_PORT }}
          KINDLE_SMTP_USERNAME: ${{ secrets.KINDLE_SMTP_USERNAME }}
          KINDLE_SMTP_PASSWORD: ${{ secrets.KINDLE_SMTP_PASSWORD }}
          REMARKABLE_DEVICE_TOKEN: ${{ secrets.REMARKABLE_DEVICE_TOKEN }}
        run: |
          python scripts/telegram_bot_poll_once.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/links.txt inbox/telegram_offset.txt inbox/archive.txt || true
          if git diff --staged --quiet; then
            echo "No new updates."
          else
            git commit -m "🤖 Sync Telegram links to inbox [skip ci]"
            git push
          fi
