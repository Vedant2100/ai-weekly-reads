

name: Research Reorientation Digest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-research-inbox
  cancel-in-progress: false

jobs:
  research-digest:
    name: Send Research Email Digest
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Send research digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YTDLP_COOKIES_TXT: ${{ secrets.YTDLP_COOKIES_TXT }}
          EMAIL_ENABLED: "true"
          EMAIL_DELIVERY_METHOD: "smtp"
          EMAIL_RECIPIENT: ${{ secrets.RESEARCH_EMAIL_TO }}
          EMAIL_SENDER: ${{ secrets.RESEARCH_EMAIL_FROM }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          GOOGLE_SHEETS_ENABLED: ${{ secrets.GOOGLE_SHEETS_ENABLED }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_WORKSHEET: ${{ secrets.GOOGLE_SHEETS_WORKSHEET }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ] && [ -n "$GOOGLE_TOKEN_JSON" ]; then
            mkdir -p config/private
            printf '%s' "$GOOGLE_CREDENTIALS_JSON" > config/private/google_credentials.json
            printf '%s' "$GOOGLE_TOKEN_JSON" > config/private/google_token.json
          fi
          python scripts/research_digest.py || test $? -eq 1

      - name: Commit queue, archive, and research state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/links.txt || true
          git add inbox/archive.txt || true
          git add inbox/link_capture.jsonl || true
          git add inbox/research_state.json || true
          if git diff --staged --quiet; then
            echo "No new summaries or ebooks generated."
          else
            git commit -m "🤖 Send research reorientation digest [skip ci]"
            git push
          fi
