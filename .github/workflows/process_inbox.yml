

name: Research Reorientation Digest

on:
  workflow_dispatch:
  schedule:
    # Check daily; the persisted runner state enforces a true one-day interval.
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: ai-research-inbox
  cancel-in-progress: false

jobs:
  research-digest:
    name: Send Research Email Digest
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Send research digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YTDLP_COOKIES_TXT: ${{ secrets.YTDLP_COOKIES_TXT }}
          EMAIL_ENABLED: "true"
          EMAIL_DELIVERY_METHOD: "apps_script"
          RESEARCH_APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbwuKOAMN3Jbb9KXhX9ez5RD6jzuZevdeSPDGS5A4ENS37i0EmSUF2EUOBf0i5JsYuJYNw/exec"
          RESEARCH_DIGEST_SECRET: ${{ secrets.RESEARCH_DIGEST_SECRET }}
        run: |
          python scripts/research_digest.py || test $? -eq 1

      - name: Commit queue, archive, and research state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/links.txt || true
          git add inbox/archive.txt || true
          git add inbox/link_capture.jsonl || true
          git add inbox/research_state.json || true
          if git diff --staged --quiet; then
            echo "No new research digest state to commit."
          else
            git commit -m "🤖 Send research reorientation digest [skip ci]"
            git push
          fi
