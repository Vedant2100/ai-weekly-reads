name: Telegram Webhook

on:
  repository_dispatch:
    types: [telegram_webhook]

permissions:
  contents: write

jobs:
  process-webhook:
    name: Process Telegram Message
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies (Pandoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install Typst
        uses: typst-community/setup-typst@v3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Process Payload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YTDLP_COOKIES_TXT: ${{ secrets.YTDLP_COOKIES_TXT }}
          KINDLE_ENABLED: "true"
          KINDLE_DELIVERY_METHOD: "smtp"
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          KINDLE_SENDER_EMAIL: ${{ secrets.KINDLE_SENDER_EMAIL }}
          KINDLE_SMTP_HOST: ${{ secrets.KINDLE_SMTP_HOST }}
          KINDLE_SMTP_PORT: ${{ secrets.KINDLE_SMTP_PORT }}
          KINDLE_SMTP_USERNAME: ${{ secrets.KINDLE_SMTP_USERNAME }}
          KINDLE_SMTP_PASSWORD: ${{ secrets.KINDLE_SMTP_PASSWORD }}
          REMARKABLE_DEVICE_TOKEN: ${{ secrets.REMARKABLE_DEVICE_TOKEN }}
          TELEGRAM_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          # Write payload to a temporary file
          echo "$TELEGRAM_PAYLOAD" > webhook_payload.json
          python scripts/handle_webhook.py webhook_payload.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/links.txt inbox/archive.txt || true
          if git diff --staged --quiet; then
            echo "No new updates."
          else
            git commit -m "🤖 Sync Telegram links to inbox (Webhook) [skip ci]"
            git push
          fi
