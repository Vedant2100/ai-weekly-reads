name: Telegram Webhook

on:
  repository_dispatch:
    types: [telegram_webhook]

permissions:
  contents: write

concurrency:
  group: ai-research-inbox
  cancel-in-progress: false

jobs:
  process-webhook:
    name: Process Telegram Message
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Process Payload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YTDLP_COOKIES_TXT: ${{ secrets.YTDLP_COOKIES_TXT }}
          TELEGRAM_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          # Write payload to a temporary file
          echo "$TELEGRAM_PAYLOAD" > webhook_payload.json
          python scripts/handle_webhook.py webhook_payload.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/links.txt inbox/link_capture.jsonl inbox/archive.txt || true
          if git diff --staged --quiet; then
            echo "No new updates."
          else
            git commit -m "🤖 Sync Telegram links to inbox (Webhook) [skip ci]"
            git push
          fi
